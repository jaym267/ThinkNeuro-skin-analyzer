[theme]
base="light"
primaryColor="#1B3252"
backgroundColor="#F7F4EF"
secondaryBackgroundColor="#FFFFFF"
textColor="#1C1C1C"
font="serif"

[server]
# Reject oversized uploads at the framework level (default is 200 MB).
maxUploadSize = 10
# Keep CSRF/XSRF protection on. We intentionally do NOT set enableCORS=false:
# Streamlit forces CORS back on whenever XSRF protection is enabled, so setting
# it only produced a startup warning. XSRF protection already restricts
# cross-origin POSTs (uploads, widget updates) to same-origin, which is the
# protection we want on a public deployment.
enableXsrfProtection = true
